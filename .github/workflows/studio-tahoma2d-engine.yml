name: Tahoma2D engine install and batch-render smoke test
on:
  workflow_dispatch:
  push:
    branches: [studio-pro-foundation]
    paths:
      - "studio/tahoma2d_*.py"
      - "tests/test_tahoma2d_*.py"
      - ".github/workflows/studio-tahoma2d-engine.yml"
permissions:
  contents: read
jobs:
  install-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download official Tahoma2D Linux release
        run: |
          curl -fL --retry 3 https://github.com/tahoma2d/tahoma2d/releases/download/v1.6.3/Tahoma2D-linux-clang.deb -o /tmp/Tahoma2D-linux-gcc.deb
          echo "b12ae63f4580af0b094950a1ff3b6288be5702a9fec0f233b3b271c34f393386  /tmp/Tahoma2D-linux-gcc.deb" | sha256sum -c -
      - name: Install Tahoma2D and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libopengl0 libgl1
          sudo apt-get install -y /tmp/Tahoma2D-linux-gcc.deb
          dpkg -L tahoma2d | tee /tmp/tahoma2d-files.txt
          grep -E "/(tahoma2d|tcomposer)$" /tmp/tahoma2d-files.txt
          grep -E "/(tahoma2d|tcomposer)$" /tmp/tahoma2d-files.txt | while read -r bin; do dirname "$bin"; done | sort -u >> "$GITHUB_PATH"
          test -x "$(grep -E "/tcomposer$" /tmp/tahoma2d-files.txt | head -1)"
      - name: Verify native batch renderer interface
        run: |
          set +e
          tcomposer > /tmp/tcomposer-usage.txt 2>&1
          code=$?
          set -e
          cat /tmp/tcomposer-usage.txt
          grep -E "Source file|srcName|-multimedia|-range" /tmp/tcomposer-usage.txt
          echo "No-argument exit code: $code (usage output expected)"
      - name: Render a real upstream animation scene with Tahoma2D
        run: |
          set -euo pipefail
          # External OpenToonz sample data is used only as a temporary compatibility fixture.
          # Its upstream repository is CC BY-NC 4.0; it is not copied into this project.
          curl -fL --retry 3 https://github.com/opentoonz/opentoonz_sample/archive/refs/heads/master.tar.gz -o /tmp/opentoonz-sample.tar.gz
          mkdir -p /tmp/opentoonz-sample
          tar -xzf /tmp/opentoonz-sample.tar.gz -C /tmp/opentoonz-sample --strip-components=1
          test -s /tmp/opentoonz-sample/dwanko_run.tnz
          mkdir -p /tmp/tahoma2d-real-smoke
          xvfb-run -a tcomposer /tmp/opentoonz-sample/dwanko_run.tnz -o /tmp/tahoma2d-real-smoke/frame.png -range 1 1 -multimedia 1 -nthreads 2
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          out = Path("/tmp/tahoma2d-real-smoke")
          candidates = [p for p in out.rglob("*") if p.is_file() and p.suffix.lower() in {".png", ".tif", ".tiff"}]
          if not candidates:
              raise SystemExit("Tahoma2D returned without producing a raster frame.")
          valid = []
          for path in candidates:
              try:
                  with Image.open(path) as im:
                      im.load()
                      rgb = im.convert("RGB")
                      if rgb.width < 64 or rgb.height < 64:
                          continue
                      stats = ImageStat.Stat(rgb.resize((96, 96)))
                      variance = sum(stats.stddev) / 3
                      if variance > 1.0:
                          valid.append((path, rgb.size, round(variance, 2), path.stat().st_size))
              except Exception:
                  continue
          if not valid:
              raise SystemExit("No decoded, non-blank Tahoma2D frame was produced.")
          print("REAL_TAHOMA2D_RENDER_OK")
          for item in valid:
              print({"file": str(item[0]), "dimensions": item[1], "variance": item[2], "bytes": item[3]})
          PY
      - name: Launch desktop application in virtual display
        run: |
          set +e
          timeout 20s xvfb-run -a tahoma2d
          code=$?
          set -e
          if [ "$code" -ne 124 ] && [ "$code" -ne 0 ]; then
            echo "Tahoma2D failed to start (exit $code)"
            exit "$code"
          fi
          echo "Tahoma2D GUI process started under Xvfb."
      - name: Run adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_tahoma2d_runtime.py' -v
          python -m unittest discover -s tests -p 'test_tahoma2d_bridge.py' -v
      - name: Save engine installation report
        if: always()
        run: |
          mkdir -p engine-report
          { echo "Tahoma2D release: v1.6.3"; dpkg -L tahoma2d | grep -E "/(tahoma2d|tcomposer)$" || true; } > engine-report/install-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tahoma2d-engine-install-report
          path: engine-report/
