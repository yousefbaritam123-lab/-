name: Tahoma2D engine install and authoring smoke test
on:
  workflow_dispatch:
  push:
    branches: [studio-pro-foundation]
    paths:
      - "studio/tahoma2d_*.py"
      - "studio/cli.py"
      - "studio/svg_character_assets.py"
      - "tests/test_tahoma2d_*.py"
      - "tests/test_svg_character_assets.py"
      - ".github/workflows/studio-tahoma2d-engine.yml"
permissions:
  contents: read
jobs:
  install-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download official Tahoma2D Linux release
        run: |
          curl -fL --retry 3 https://github.com/tahoma2d/tahoma2d/releases/download/v1.6.3/Tahoma2D-linux-clang.deb -o /tmp/Tahoma2D-linux-gcc.deb
          echo "b12ae63f4580af0b094950a1ff3b6288be5702a9fec0f233b3b271c34f393386  /tmp/Tahoma2D-linux-gcc.deb" | sha256sum -c -
      - name: Install Tahoma2D and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils x11-apps imagemagick tesseract-ocr libopengl0 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-sync1 libxcb-xkb1
          python -m pip install --upgrade pip pillow
          sudo apt-get install -y /tmp/Tahoma2D-linux-gcc.deb
          dpkg -L tahoma2d | tee /tmp/tahoma2d-files.txt
          grep -E "/(tahoma2d|tcomposer)$" /tmp/tahoma2d-files.txt
          grep -E "/(tahoma2d|tcomposer)$" /tmp/tahoma2d-files.txt | while read -r bin; do dirname "$bin"; done | sort -u >> "$GITHUB_PATH"
          test -x "$(grep -E "/tcomposer$" /tmp/tahoma2d-files.txt | head -1)"
      - name: Verify native batch renderer interface
        run: |
          set +e
          tcomposer > /tmp/tcomposer-usage.txt 2>&1
          code=$?
          set -e
          cat /tmp/tcomposer-usage.txt
          grep -E "Source file|srcName|-multimedia|-range" /tmp/tcomposer-usage.txt
          echo "No-argument exit code: $code (usage output expected)"
      - name: Prepare the actual Youssef and Adam source artwork for Tahoma2D
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m studio.cli init /tmp/youssef-tahoma2d-pilot
          python -m studio.cli tahoma2d-prepare /tmp/youssef-tahoma2d-pilot
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/youssef-tahoma2d-pilot/production/tahoma2d/characters")
          expected = {"youssef", "adam"}
          actual = {p.name for p in root.iterdir() if p.is_dir()}
          if not expected.issubset(actual):
              raise SystemExit(f"Missing prepared cast assets: {expected - actual}")
          for character in sorted(expected):
              folder = root / character
              manifest = json.loads((folder / "tahoma2d_character_manifest.json").read_text(encoding="utf-8"))
              source = folder / manifest["reference_art"]
              if not source.is_file() or source.stat().st_size < 100:
                  raise SystemExit(f"Missing or invalid original artwork reference for {character}")
              if manifest.get("rigging_status") not in {
                  "vector_parts_segmented_at_existing_path_vertices_plastic_mesh_and_skeleton_not_yet_authored",
                  "vector_layers_exported_plastic_skeleton_not_yet_authored",
              }:
                  raise SystemExit(f"Unexpected rigging status for {character}")
              layer_ids = {item["id"] for item in manifest.get("layers", [])}
              required = {"upper_arm_L", "forearm_L", "upper_arm_R", "forearm_R",
                          "thigh_L", "shin_L", "thigh_R", "shin_R", "torso_centerline", "head"}
              missing = required - layer_ids
              if missing:
                  raise SystemExit(f"{character} is missing articulated source layers: {sorted(missing)}")
              if manifest.get("layer_count", 0) < 14 or not (folder / "rig_layers.svg").is_file():
                  raise SystemExit(f"{character} segmented vector package is incomplete")
          print("YOUSEFF_ADAM_SOURCE_ART_PREPARED")
          PY
      - name: Prepare native scene inputs and ToonzScript
        run: |
          python - <<'PY'
          from pathlib import Path
          from studio.tahoma2d_authoring import prepare_scene_levels, write_toonzscript
          project = Path("/tmp/youssef-tahoma2d-pilot")
          levels = prepare_scene_levels(project, project / "production/tahoma2d/authoring")
          script = write_toonzscript(
              project / "production/tahoma2d/scenes/youssef-adam-source-pilot.tnz",
              levels,
              project / "production/tahoma2d/authoring/create_native_scene.js",
              frames=24,
          )
          print("Prepared Tahoma2D ToonzScript:", script)
          PY
      - name: Author a genuine .tnz scene inside Tahoma2D
        env:
          QT_X11_NO_MITSHM: "1"
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          APP_PID=""
          trap 'kill "$APP_PID" "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2
          tahoma2d >/tmp/tahoma2d-gui.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if xdotool search --onlyvisible --name 'Tahoma' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          SCRIPT_DIR="$HOME/.local/share/Tahoma2D/library/scripts"
          mkdir -p "$SCRIPT_DIR"
          cp /tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring/create_native_scene.js "$SCRIPT_DIR/create_native_scene.js"
          sleep 4
          for title in 'Tahoma2D Tips' 'Tahoma2D Startup'; do
            for window in $(xdotool search --onlyvisible --name "$title" 2>/dev/null || true); do
              xdotool windowclose "$window" || true
              sleep 1
            done
          done
          MAIN_WINDOW=$(xdotool search --onlyvisible --name 'Tahoma2D 1.6.3' 2>/dev/null | head -1 || true)
          if [ -z "$MAIN_WINDOW" ]; then
            xwininfo -root -tree || true
            echo "Tahoma2D main window was not available after dismissing first-run panels."
            exit 1
          fi
          xdotool windowraise "$MAIN_WINDOW"
          xdotool windowfocus "$MAIN_WINDOW"
          sleep 1
          # Open the File menu by its measured position in the borderless
          # Xvfb window. Alt+F is unreliable in this Qt build and can leave
          # only the menu bar visible (the old OCR step then searched nothing).
          xdotool windowfocus --sync "$MAIN_WINDOW"
          eval "$(xdotool getwindowgeometry --shell "$MAIN_WINDOW")"
          export WINDOW_X="$X" WINDOW_Y="$Y"
          xdotool mousemove "$((X+16))" "$((Y+10))" click 1
          sleep 1
          import -window root /tmp/tahoma2d-file-menu-open.png
          import -window root /tmp/tahoma2d-file-menu-open.png
          convert /tmp/tahoma2d-file-menu-open.png -crop "760x820+$X+$Y" +repage -resize 200% /tmp/tahoma2d-file-menu-crop.png
          tesseract /tmp/tahoma2d-file-menu-crop.png stdout --psm 6 > /tmp/tahoma2d-file-menu.txt
          python - <<'PY'
          import csv
          import re
          import subprocess
          import time
          from pathlib import Path

          screen = Path("/tmp/tahoma2d-file-menu-crop.png")
          text = Path("/tmp/tahoma2d-file-menu.txt").read_text(encoding="utf-8", errors="replace")
          normalized = re.sub(r"[^a-z]+", " ", text.lower())
          subprocess.run(
              ["tesseract", str(screen), "stdout", "--psm", "6", "tsv"],
              check=True, stdout=Path("/tmp/tahoma2d-file-menu.tsv").open("w", encoding="utf-8")
          )
          rows = list(csv.DictReader(Path("/tmp/tahoma2d-file-menu.tsv").open(), delimiter="\t"))
          words = [r for r in rows if r.get("text", "").strip() and int(float(r.get("conf", "-1"))) >= 10]

          def find_phrase(items, phrase):
              target = phrase.split()
              for i in range(len(items)):
                  candidate = [x["text"].strip().lower() for x in items[i:i+len(target)]]
                  if candidate == target:
                      return items[i:i+len(target)]
              return None

          match = find_phrase(words, "open script console")
          if match is None:
              # Tahoma builds with a nested File > Script submenu are handled too.
              script_items = [r for r in words if r["text"].strip().lower() == "script"]
              if not script_items:
                  print("File menu OCR:", text)
                  raise SystemExit("File menu is open, but OCR cannot identify its Script command")
              item = script_items[0]
              # OCR image is scaled to 200%; convert its bounds back to desktop coordinates.
              x = int(item["left"]) // 2 + int(__import__("os").environ["WINDOW_X"])
              y = int(item["top"]) // 2 + int(__import__("os").environ["WINDOW_Y"])
              subprocess.run(["xdotool", "mousemove", str(x), str(y), "click", "1"], check=True)
              time.sleep(1)
              import subprocess as sp
              sp.run(["import", "-window", "root", "/tmp/tahoma2d-script-submenu.png"], check=True)
              sp.run([
                  "convert", "/tmp/tahoma2d-script-submenu.png",
                  "-crop", "900x820+" + __import__("os").environ["WINDOW_X"] + "+" + __import__("os").environ["WINDOW_Y"],
                  "+repage", "-resize", "200%", "/tmp/tahoma2d-script-submenu-crop.png"
              ], check=True)
              submenu = Path("/tmp/tahoma2d-script-submenu-crop.png")
              sp.run(
                  ["tesseract", str(submenu), "stdout", "--psm", "6"],
                  check=True, stdout=Path("/tmp/tahoma2d-script-submenu.txt").open("w", encoding="utf-8")
              )
              text = Path("/tmp/tahoma2d-script-submenu.txt").read_text(encoding="utf-8", errors="replace")
              sp.run(
                  ["tesseract", str(submenu), "stdout", "--psm", "6", "tsv"],
                  check=True, stdout=Path("/tmp/tahoma2d-menu-final.tsv").open("w", encoding="utf-8")
              )
              rows = list(csv.DictReader(Path("/tmp/tahoma2d-menu-final.tsv").open(), delimiter="\t"))
              words = [r for r in rows if r.get("text", "").strip() and int(float(r.get("conf", "-1"))) >= 10]
              match = find_phrase(words, "open script console")
              crop_x = int(__import__("os").environ["WINDOW_X"])
              crop_y = int(__import__("os").environ["WINDOW_Y"])
          else:
              crop_x = int(__import__("os").environ["WINDOW_X"])
              crop_y = int(__import__("os").environ["WINDOW_Y"])

          if match is None:
              print("Menu OCR:", text)
              raise SystemExit("Could not locate Open Script Console in Tahoma2D's File menu")

          left = min(int(x["left"]) for x in match)
          top = min(int(x["top"]) for x in match)
          right = max(int(x["left"]) + int(x["width"]) for x in match)
          bottom = max(int(x["top"]) + int(x["height"]) for x in match)
          Path("/tmp/tahoma2d-console-menu-click.txt").write_text(
              f"{left // 2 + crop_x} {top // 2 + crop_y}\n", encoding="utf-8"
          )
          print("SCRIPT_CONSOLE_MENU_BOUNDS", left, top, right, bottom)
          PY
          read MENU_X MENU_Y < /tmp/tahoma2d-console-menu-click.txt
          xdotool mousemove "$MENU_X" "$MENU_Y" click 1
          sleep 3
          import -window root /tmp/tahoma2d-script-console-open.png
          convert /tmp/tahoma2d-script-console-open.png -resize 150% /tmp/tahoma2d-console-screen-large.png
          tesseract /tmp/tahoma2d-console-screen-large.png stdout --psm 11 > /tmp/tahoma2d-console-screen.txt
          grep -qi "script console" /tmp/tahoma2d-console-screen.txt || {
            cat /tmp/tahoma2d-console-screen.txt
            echo "Tahoma2D Script Console did not become visible."
            exit 1
          }
          SCRIPT_PATH="/tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring/create_native_scene.js"
          xdotool key --clearmodifiers ctrl+end
          xdotool type --clearmodifiers --delay 1 "run(\"$SCRIPT_PATH\")"
          xdotool key Return
          sleep 15
          SCENE=/tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes/youssef-adam-source-pilot.tnz
          if [ ! -s "$SCENE" ]; then
            import -window root /tmp/tahoma2d-screen.png || true
            xwininfo -root -tree || true
            import -window root /tmp/tahoma2d-screen.png || true
            cat /tmp/tahoma2d-gui.log || true
            echo "Tahoma2D did not save the requested native scene through ToonzScript."
            exit 1
          fi
          mkdir -p /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof
          tcomposer "$SCENE" -o /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof/frame.png -range 1 1 -multimedia 1 -nthreads 2
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          scene = Path("/tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes/youssef-adam-source-pilot.tnz")
          frame = Path("/tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof/frame.png")
          if not scene.is_file() or scene.stat().st_size < 100:
              raise SystemExit("Native .tnz file missing or empty")
          with Image.open(frame) as image:
              image.verify()
          with Image.open(frame) as image:
              print("TAHOMA2D_RENDER_PROOF", {"scene_bytes": scene.stat().st_size, "frame_size": image.size, "frame_bytes": frame.stat().st_size})
              if image.width < 100 or image.height < 100:
                  raise SystemExit("Rendered frame dimensions are unexpectedly small")
          PY
      - name: Run adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_tahoma2d_runtime.py' -v
          python -m unittest discover -s tests -p 'test_tahoma2d_bridge.py' -v
          python -m unittest discover -s tests -p 'test_tahoma2d_cli.py' -v
          python -m unittest discover -s tests -p 'test_svg_character_assets.py' -v
      - name: Save engine installation report
        if: always()
        run: |
          mkdir -p engine-report
          { echo "Tahoma2D release: v1.6.3"; dpkg -L tahoma2d | grep -E "/(tahoma2d|tcomposer)$" || true; } > engine-report/install-report.txt
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/characters ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/characters engine-report/
          fi
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring engine-report/
          fi
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes engine-report/
          fi
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof engine-report/
          fi
          if [ -f /tmp/tahoma2d-screen.png ]; then cp /tmp/tahoma2d-screen.png engine-report/; fi
          if [ -f /tmp/tahoma2d-file-menu.png ]; then cp /tmp/tahoma2d-file-menu.png engine-report/; fi
          if [ -f /tmp/tahoma2d-file-menu-pressed.png ]; then cp /tmp/tahoma2d-file-menu-pressed.png engine-report/; fi
          if [ -f /tmp/tahoma2d-file-menu-click.png ]; then cp /tmp/tahoma2d-file-menu-click.png engine-report/; fi
          if [ -f /tmp/tahoma2d-file-menu-f10.png ]; then cp /tmp/tahoma2d-file-menu-f10.png engine-report/; fi
          if [ -f /tmp/tahoma2d-file-menu-open.png ]; then cp /tmp/tahoma2d-file-menu-open.png engine-report/; fi
          if [ -f /tmp/tahoma2d-run-script-dialog-missing.png ]; then cp /tmp/tahoma2d-run-script-dialog-missing.png engine-report/; fi
          if [ -f /tmp/tahoma2d-pointer-location.txt ]; then cp /tmp/tahoma2d-pointer-location.txt engine-report/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tahoma2d-engine-install-report
          path: engine-report/
