name: Tahoma2D engine install and authoring smoke test
on:
  workflow_dispatch:
  push:
    branches: [studio-pro-foundation]
    paths:
      - "studio/tahoma2d_*.py"
      - "studio/cli.py"
      - "studio/svg_character_assets.py"
      - "tests/test_tahoma2d_*.py"
      - "tests/test_svg_character_assets.py"
      - ".github/workflows/studio-tahoma2d-engine.yml"
permissions:
  contents: read
jobs:
  install-and-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download official Tahoma2D Linux release
        run: |
          curl -fL --retry 3 https://github.com/tahoma2d/tahoma2d/releases/download/v1.6.3/Tahoma2D-linux-clang.deb -o /tmp/Tahoma2D-linux-gcc.deb
          echo "b12ae63f4580af0b094950a1ff3b6288be5702a9fec0f233b3b271c34f393386  /tmp/Tahoma2D-linux-gcc.deb" | sha256sum -c -
      - name: Install Tahoma2D and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libopengl0 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-sync1 libxcb-xkb1
          python -m pip install --upgrade pip pillow
          sudo apt-get install -y /tmp/Tahoma2D-linux-gcc.deb
          dpkg -L tahoma2d | tee /tmp/tahoma2d-files.txt
          grep -E "/(tahoma2d|tcomposer)$" /tmp/tahoma2d-files.txt
          grep -E "/(tahoma2d|tcomposer)$" /tmp/tahoma2d-files.txt | while read -r bin; do dirname "$bin"; done | sort -u >> "$GITHUB_PATH"
          test -x "$(grep -E "/tcomposer$" /tmp/tahoma2d-files.txt | head -1)"
      - name: Verify native batch renderer interface
        run: |
          set +e
          tcomposer > /tmp/tcomposer-usage.txt 2>&1
          code=$?
          set -e
          cat /tmp/tcomposer-usage.txt
          grep -E "Source file|srcName|-multimedia|-range" /tmp/tcomposer-usage.txt
          echo "No-argument exit code: $code (usage output expected)"
      - name: Prepare the actual Youssef and Adam source artwork for Tahoma2D
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m studio.cli init /tmp/youssef-tahoma2d-pilot
          python -m studio.cli tahoma2d-prepare /tmp/youssef-tahoma2d-pilot
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/youssef-tahoma2d-pilot/production/tahoma2d/characters")
          expected = {"youssef", "adam"}
          actual = {p.name for p in root.iterdir() if p.is_dir()}
          if not expected.issubset(actual):
              raise SystemExit(f"Missing prepared cast assets: {expected - actual}")
          for character in sorted(expected):
              folder = root / character
              manifest = json.loads((folder / "tahoma2d_character_manifest.json").read_text(encoding="utf-8"))
              source = folder / manifest["reference_art"]
              if not source.is_file() or source.stat().st_size < 100:
                  raise SystemExit(f"Missing or invalid original artwork reference for {character}")
              if manifest.get("rigging_status") not in {
                  "vector_parts_segmented_at_existing_path_vertices_plastic_mesh_and_skeleton_not_yet_authored",
                  "vector_layers_exported_plastic_skeleton_not_yet_authored",
              }:
                  raise SystemExit(f"Unexpected rigging status for {character}")
              layer_ids = {item["id"] for item in manifest.get("layers", [])}
              required = {"upper_arm_L", "forearm_L", "upper_arm_R", "forearm_R",
                          "thigh_L", "shin_L", "thigh_R", "shin_R", "torso_centerline", "head"}
              missing = required - layer_ids
              if missing:
                  raise SystemExit(f"{character} is missing articulated source layers: {sorted(missing)}")
              if manifest.get("layer_count", 0) < 14 or not (folder / "rig_layers.svg").is_file():
                  raise SystemExit(f"{character} segmented vector package is incomplete")
          print("YOUSEFF_ADAM_SOURCE_ART_PREPARED")
          PY
      - name: Prepare native scene inputs and ToonzScript
        run: |
          python - <<'PY'
          from pathlib import Path
          from studio.tahoma2d_authoring import prepare_scene_levels, write_toonzscript
          project = Path("/tmp/youssef-tahoma2d-pilot")
          levels = prepare_scene_levels(project, project / "production/tahoma2d/authoring")
          script = write_toonzscript(
              project / "production/tahoma2d/scenes/youssef-adam-source-pilot.tnz",
              levels,
              project / "production/tahoma2d/authoring/create_native_scene.js",
              frames=24,
          )
          print("Prepared Tahoma2D ToonzScript:", script)
          PY
      - name: Author a genuine .tnz scene inside Tahoma2D
        env:
          QT_X11_NO_MITSHM: "1"
        run: |
          set -euo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x1000x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$APP_PID" "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2
          tahoma2d >/tmp/tahoma2d-gui.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if xdotool search --onlyvisible --name 'Tahoma' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdotool key --clearmodifiers alt+f
          sleep 1
          xdotool key --clearmodifiers s
          sleep 1
          xdotool key --clearmodifiers r
          sleep 2
          xdotool key --clearmodifiers ctrl+l
          xdotool type --clearmodifiers --delay 1 '/tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring/create_native_scene.js'
          xdotool key Return
          sleep 12
          SCENE=/tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes/youssef-adam-source-pilot.tnz
          if [ ! -s "$SCENE" ]; then
            import -window root /tmp/tahoma2d-screen.png || true
            cat /tmp/tahoma2d-gui.log || true
            echo "Tahoma2D did not save the requested native scene through ToonzScript."
            exit 1
          fi
          mkdir -p /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof
          tcomposer "$SCENE" -o /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof/frame.png -range 1 1 -multimedia 1 -nthreads 2
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          scene = Path("/tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes/youssef-adam-source-pilot.tnz")
          frame = Path("/tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof/frame.png")
          if not scene.is_file() or scene.stat().st_size < 100:
              raise SystemExit("Native .tnz file missing or empty")
          with Image.open(frame) as image:
              image.verify()
          with Image.open(frame) as image:
              print("TAHOMA2D_RENDER_PROOF", {"scene_bytes": scene.stat().st_size, "frame_size": image.size, "frame_bytes": frame.stat().st_size})
              if image.width < 100 or image.height < 100:
                  raise SystemExit("Rendered frame dimensions are unexpectedly small")
          PY
      - name: Run adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_tahoma2d_runtime.py' -v
          python -m unittest discover -s tests -p 'test_tahoma2d_bridge.py' -v
          python -m unittest discover -s tests -p 'test_tahoma2d_cli.py' -v
          python -m unittest discover -s tests -p 'test_svg_character_assets.py' -v
      - name: Save engine installation report
        if: always()
        run: |
          mkdir -p engine-report
          { echo "Tahoma2D release: v1.6.3"; dpkg -L tahoma2d | grep -E "/(tahoma2d|tcomposer)$" || true; } > engine-report/install-report.txt
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/characters ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/characters engine-report/
          fi
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/authoring engine-report/
          fi
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/scenes engine-report/
          fi
          if [ -d /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof ]; then
            cp -a /tmp/youssef-tahoma2d-pilot/production/tahoma2d/render-proof engine-report/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tahoma2d-engine-install-report
          path: engine-report/
