name: Studio Python checks

on:
  push:
    branches:
      - studio-pro-foundation
  pull_request:
    branches:
      - studio-pro-foundation

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check skia-python Pillow imageio-ffmpeg CairoSVG
      - name: Install optional editorial engine for integration tests
        run: python -m pip install --disable-pip-version-check 'moviepy>=2.1,<3'
      - name: Run production manager, renderer and editorial integration tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python -m studio.cli --help
