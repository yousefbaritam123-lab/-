name: Render real 10-second studio test

on:
  push:
    branches:
      - studio-pro-foundation
    paths:
      - ".github/workflows/studio-real-10s-render.yml"
      - "studio/**"
      - "assets/**"
      - "examples/pilot-15s/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-real-10s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-pro-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install graphics libraries and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 fonts-noto-core ffmpeg
      - name: Install renderer dependencies
        run: python -m pip install --disable-pip-version-check skia-python imageio-ffmpeg Pillow
      - name: Initialize real studio project
        run: |
          python -m studio.cli init projects/real-10s
          cp examples/pilot-15s/episode.json projects/real-10s/episode.json
          cp examples/pilot-15s/continuity.json projects/real-10s/continuity.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("projects/real-10s/episode.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["id"] = "youssef-real-engine-10s"
          data["title"] = "اختبار المحرك الحقيقي - 10 ثوانٍ"
          data["format"]["duration_seconds"] = 10
          data["shots"] = data["shots"][:2]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Validate episode with studio
        run: python -m studio.cli validate projects/real-10s
      - name: Render 300 frames with the repository renderer
        run: python -m studio.cli render projects/real-10s --resume
      - name: Audit every frame and encode the technical render
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageStat
          project = Path("projects/real-10s")
          frames = project / "renders" / "frames"
          expected = 300
          errors = []
          verified = 0
          for number in range(expected):
              path = frames / f"frame_{number:06d}.png"
              if not path.is_file() or path.stat().st_size < 256:
                  errors.append(f"missing_or_tiny:{number}")
                  continue
              try:
                  with Image.open(path) as image:
                      image.verify()
                  with Image.open(path) as image:
                      image = image.convert("RGB")
                      if image.size != (540, 960):
                          errors.append(f"wrong_dimensions:{number}:{image.size}")
                          continue
                      variance = sum(ImageStat.Stat(image.resize((96, 96))).stddev) / 3
                      if variance < 1.15:
                          errors.append(f"blank:{number}")
                          continue
              except Exception as exc:
                  errors.append(f"corrupt:{number}:{exc}")
                  continue
              verified += 1
          report = {
              "mode": "technical_render_test_not_delivery_certification",
              "expected_frames": expected,
              "verified_frames": verified,
              "errors": errors,
              "audio_gate": "not evaluated in this silent technical render",
              "human_visual_approval": "required separately before publication",
          }
          out = project / "production" / "technical_render_report.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          if errors or verified != expected:
              raise SystemExit("Technical frame audit failed")
          PY
          python -m studio.cli encode projects/real-10s
      - name: Verify actual MP4 properties
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json projects/real-10s/renders/episode.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: youssef-real-engine-10s
          path: |
            projects/real-10s/renders/episode.mp4
            projects/real-10s/production/technical_render_report.json
          if-no-files-found: error
          retention-days: 14
