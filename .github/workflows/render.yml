name: Render Stickman Episode
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Render MP4
        run: python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: stickman-episode-mp4
          path: output/last_piece_of_bread.mp4
          if-no-files-found: error
          retention-days: 30
