name: Blender engine integration

on:
  push:
    branches:
      - studio-pro-foundation
    paths:
      - "studio/blender_bridge.py"
      - "studio/svg_character_assets.py"
      - "studio/frame_interpolation.py"
      - "tools/blender_scene.py"
      - "studio/cli.py"
      - "studio/audio.py"
      - "studio/editorial.py"
      - "studio/script_qc.py"
      - "studio/director.py"
      - "studio/quality.py"
      - "studio/production.py"
      - "tests/**"
      - ".github/workflows/studio-blender-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-pro-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1
          blender --version
          ffmpeg -version | head -n 1
      - name: Install Python bridge dependencies
        run: python -m pip install --disable-pip-version-check Pillow imageio-ffmpeg skia-python CairoSVG
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Create a two-second 2D scene
        run: |
          python -m studio.cli init projects/blender-integration
          test -f projects/blender-integration/assets/characters/cast_60/contact_sheet.svg
          test -f projects/blender-integration/assets/characters/youssef/design_sheet.svg
          test -f projects/blender-integration/assets/characters/adam/design_sheet.svg
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("projects/blender-integration")
          path = root / "episode.json"
          episode = json.loads(path.read_text(encoding="utf-8"))
          episode["id"] = "blender-integration-smoke"
          episode["title"] = "Blender 2D render integration"
          episode["format"] = {"width": 360, "height": 640, "fps": 30, "duration_seconds": 2}
          episode["characters"].append({
              "id": "extra_test", "name": "Extra cast import",
              "cast_id": "extra_001",
              "rig": "assets/characters/youssef/character.toon.json",
              "x": 180, "y": 500, "scale": 1.0
          })
          episode["locations"] = [
              {"id": "street_01", "name": "Algerian street", "sky_bottom": "#D9E3EA", "ground": "#647D62"},
              {"id": "classroom_01", "name": "Classroom", "environment": "classroom"},
              {"id": "rooftop_01", "name": "Rooftop", "environment": "rooftop"},
              {"id": "park_01", "name": "Park", "environment": "park"},
              {"id": "beach_01", "name": "Beach", "environment": "beach"}
          ]
          environments = ["street_01", "classroom_01", "rooftop_01", "park_01", "beach_01"]
          actions = ["wave", "walk", "think", "celebrate", "talk"]
          episode["shots"] = [{
              "id": f"smoke-shot-{index + 1}",
              "duration_seconds": 0.4,
              "location": environment,
              "actors": ["youssef", "adam", "extra_test"],
              "action": actions[index],
              "camera": {"zoom": 1.0 + index * 0.04, "x": index * 4},
              "positions": {"youssef": {"x": 80, "y": 500}, "adam": {"x": 280, "y": 500}, "extra_test": {"x": 180, "y": 500}},
              "motion_tracks": {
                  "youssef": [{"start": 0, "end": 0.4, "action": actions[index]}],
                  "adam": [{"start": 0, "end": 0.4, "action": "listen"}]
              },
              "dialogue": []
          } for index, environment in enumerate(environments)]
          path.write_text(json.dumps(episode, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Validate and render with Blender
        run: |
          python -m studio.cli validate projects/blender-integration
          python -m studio.cli blender-render projects/blender-integration --blender blender
      - name: Verify frame sequence and MP4 metadata
        run: |
          test "$(find projects/blender-integration/renders/blender/frames -name 'frame_*.png' | wc -l)" -eq 60
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json projects/blender-integration/renders/blender/episode-blender.mp4
          cat projects/blender-integration/renders/blender/render_integrity.json
      - uses: actions/upload-artifact@v4
        with:
          name: blender-engine-smoke-test
          path: |
            projects/blender-integration/renders/blender/episode-blender.mp4
            projects/blender-integration/renders/blender/render_integrity.json
            projects/blender-integration/renders/blender/frames/frame_000001.png
            projects/blender-integration/renders/blender/frames/frame_000030.png
            projects/blender-integration/renders/blender/frames/frame_000060.png
          if-no-files-found: error
          retention-days: 14
